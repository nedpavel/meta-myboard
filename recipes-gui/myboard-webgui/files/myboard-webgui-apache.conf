# Web-Oberflaeche (myboard-webgui) in Apache. mod_proxy/mod_proxy_http
# laedt conf.d/00-myboard.conf (myboard-lamp).

# Seiten unter /usr/share/myboard-webgui/www; ein Update vom USB-Stick
# tauscht das Verzeichnis aus, deshalb no-cache.
RedirectMatch 301 ^/gui$ /gui/
Alias /gui/ /usr/share/myboard-webgui/www/
<Directory /usr/share/myboard-webgui/www>
    Require all granted
    Header set Cache-Control "no-cache"
</Directory>

# Hintergrund-Dienst myboard-webgui-api (CAN, DDS, USB-Update).
# flushpackets=on: die CAN-Werte kommen als Server-Sent Events und muessen
# sofort durchgereicht werden; der Strom bleibt lange offen.
ProxyPass        /api/ http://127.0.0.1:8081/api/ flushpackets=on timeout=3600
ProxyPassReverse /api/ http://127.0.0.1:8081/api/
