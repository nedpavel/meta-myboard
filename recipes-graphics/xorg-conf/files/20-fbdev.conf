Section "Device"
    Identifier "Framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "Default Screen"
    Device "Framebuffer"
    Monitor "Default Monitor"
    DefaultDepth 24
EndSection

# Kiosk: Bildschirm darf nie schwarz werden / abschalten.
# Screen-Blanking und DPMS komplett deaktivieren (alle Timeouts = 0).
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection

Section "Monitor"
    Identifier "Default Monitor"
    Option "DPMS" "false"
EndSection
