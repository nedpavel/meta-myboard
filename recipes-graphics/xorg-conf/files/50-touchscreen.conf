# Touchscreen (PenMount USB, DIALOGUE INC [14e1:6000])
#
# Unter X11 wird der Touchscreen von libinput bedient — NICHT von tslib.
# tslib wirkt nur bei Anwendungen, die direkt auf den Framebuffer gehen;
# eine mit ts_calibrate erzeugte Kalibrierung bleibt hier also wirkungslos.
# Die Umrechnung macht stattdessen die Transformationsmatrix von X.
#
# Standard ist die Einheitsmatrix (1:1-Abbildung):
#       1 0 0
#       0 1 0
#       0 0 1
# In Matrixschreibweise fuer Xorg: "1 0 0 0 1 0 0 0 1"
#
# KALIBRIEREN (auf dem Geraet, bei laufender X-Sitzung):
#       DISPLAY=:0 xinput_calibrator
# Das Programm zeigt vier Punkte zum Antippen und gibt danach einen
# fertigen Konfigurationsblock aus. Dessen Werte hier eintragen
# (Option "CalibrationMatrix" bzw. die vier Calibration-Werte),
# anschliessend X neu starten:
#       systemctl restart myboard-gui
#
# Beispiel fuer den Fall, dass der Cursor nur die halbe Strecke macht
# (Eingabebereich doppelt so gross wie der Schirm) — die Diagonale
# verdoppelt die Bewegung:
#       Option "TransformationMatrix" "2 0 0 0 2 0 0 0 1"

Section "InputClass"
    Identifier   "PenMount Touchscreen"
    MatchProduct "PenMount"
    MatchIsTouchscreen "on"
    Driver       "libinput"
    Option       "TransformationMatrix" "1 0 0 0 1 0 0 0 1"
EndSection
