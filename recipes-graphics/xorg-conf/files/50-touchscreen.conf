# Touchscreen (PenMount USB, DIALOGUE INC [14e1:6000])
#
# WICHTIG — es gibt zwei verschiedene Matrizen, und nur eine davon
# kalibriert wirklich:
#
#   "Coordinate Transformation Matrix"  (Xorg, Option TransformationMatrix)
#       rechnet ZEIGERkoordinaten um, nachdem libinput sie erzeugt hat.
#       Wirkt also zu spaet — sie skaliert den Cursor, nicht die Eingabe.
#   "libinput Calibration Matrix"       (Option CalibrationMatrix)
#       kalibriert die TOUCH-Eingabe selbst. Das ist die richtige.
#
# Auf dem Geraet war nachweisbar:
#       Coordinate Transformation Matrix: 0.5 0 0 0 0.5 0 0 0 1
#       libinput Calibration Matrix:      1 0 0 0 1 0 0 0 1   <- unveraendert
# Deshalb blieb die Kalibrierung wirkungslos, obwohl die Werte ankamen.
#
# Die Matrix beschreibt, wie der genutzte Teil der Touch-Flaeche auf den
# Bildschirm abgebildet wird:
#       a 0 c      a = Breite des genutzten Bereichs (1.0 = voll)
#       0 e f      c = Verschiebung in X (Anteil der Breite)
#       0 0 1      e, f = dasselbe fuer Y
#
# Beispiele:
#   "1 0 0 0 1 0 0 0 1"          unveraendert (Standard)
#   "2 0 0 0 2 0 0 0 1"          Touch nutzt nur die linke obere Haelfte
#   "0.5 0 0 0 0.5 0 0 0 1"      Touch meldet doppelt so grossen Bereich
#   "1 0 0 0 -1 1 0 0 1"         Y gespiegelt
#   "-1 1 0 0 -1 1 0 0 1"        um 180 Grad gedreht
#
# KALIBRIEREN auf dem Geraet:
#       DISPLAY=:0 xinput_calibrator
# Achtung: Das Programm gibt oft einen Block mit Option "Calibration"
# (vier Zahlen) aus — den versteht nur der alte evdev-Treiber und er
# bleibt unter libinput wirkungslos. Gibt es eine "CalibrationMatrix"
# aus, diese neun Werte hier eintragen. Danach:
#       systemctl restart myboard-gui

Section "InputClass"
    Identifier   "PenMount Touchscreen"
    MatchProduct "PenMount"
    MatchIsTouchscreen "on"
    Driver       "libinput"
    # Am Geraet ermittelt und bestaetigt: der Touchscreen nutzt nur das
    # mittlere Viertel seines gemeldeten Wertebereichs. Daher doppelte
    # Skalierung (2) und Verschiebung um eine halbe Bildschirmbreite
    # bzw. -hoehe (-0.5).
    Option       "CalibrationMatrix" "2 0 -0.5 0 2 -0.5 0 0 1"
EndSection
