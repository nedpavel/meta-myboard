# AKTIVE Grafikkonfiguration fuer das Pixy 1000 (Apollo Lake, HD Graphics 500).
#
# modesetting redet direkt ueber DRM mit i915. Auf dem Geraet verifiziert:
#   Output eDP-1 connected, using initial mode 1024x768
#
# Warum NICHT fbdev (siehe 20-fbdev.conf.disabled): /dev/fb0 ist hier nur
# die DRM-Emulation von i915. Der fbdev-Treiber scheiterte dort reproduzier-
# bar an der Farbtabelle — "FBDEV(0): FBIOPUTCMAP: Invalid argument", 30x im
# Xorg-Log, Ergebnis: schwarzer Bildschirm bei laufendem X.
#
# Falls modesetting einmal Probleme macht, zurueck auf fbdev:
#   rm /etc/X11/xorg.conf.d/20-modesetting.conf
#   mv /etc/X11/xorg.conf.d/20-fbdev.conf.disabled \
#      /etc/X11/xorg.conf.d/20-fbdev.conf
#   systemctl restart myboard-gui
#
# Zwischenstufe bei Grafikproblemen: Beschleunigung abschalten — in der
# Device-Section einfuegen:
#       Option "AccelMethod" "none"
# glamor war beim INC-100 (Bay Trail) die Ursache der GPU-Haenger.

Section "Device"
    Identifier "Grafik"
    Driver "modesetting"
EndSection

Section "Screen"
    Identifier "Default Screen"
    Device "Grafik"
    Monitor "Default Monitor"
    DefaultDepth 24
EndSection

# Kiosk: Bildschirm darf nie schwarz werden / abschalten.
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection

Section "Monitor"
    Identifier "Default Monitor"
    Option "DPMS" "false"
EndSection
