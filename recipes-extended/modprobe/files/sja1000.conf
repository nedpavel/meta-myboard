# SJA1000 ISA/LPC (via FPGA) parameters, applied when sja1000_isa is loaded
# by /etc/modules-load.d/can.conf.
#   port = I/O base address
#   irq  = interrupt line
#   clk  = external oscillator frequency in Hz (16 MHz -> CAN clock 8 MHz)
# Note: the mainline sja1000 driver runs the chip in PeliCAN mode only; there
# is no "type"/BasicCAN parameter. PeliCAN is a superset and communicates with
# BasicCAN nodes using standard 11-bit frames just the same.
options sja1000_isa port=0x340 irq=5 clk=16000000
