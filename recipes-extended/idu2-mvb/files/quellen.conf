# Feste Werte fuer die Source-Ports von idu2-mvb, eine Zeile je Signal:
#
#   NAME=WERT
#
# NAME wie in der Busbeschreibung bzw. in myboard.mvb_prozessdaten
# (richtung 'schreiben'); Signale der anderen Rolle werden ignoriert
# (Meldung im Journal). Alles hinter dem ersten '=' ist der Wert,
# Leerzeichen eingeschlossen. Zahlen dezimal oder mit 0x; bool 0/1; float in
# Prozent; datetime als Unix-Zeit; string als Text.
#
# Ohne Eintrag gilt 0 bzw. leer - fuer Befehle und Softkeys "nicht
# gedrueckt". Das Lebenszeichen fuehrt der Dienst selbst. Zur Laufzeit
# setzt die Oberflaeche Werte ueber den Socket /run/idu2-mvb.sock:
#   {"befehl": "setzen", "signal": "IDU2-XScreenNum", "wert": 3}
#
# Nach einer Aenderung: systemctl restart idu2-mvb
#
# Beispiele (Rolle IDU2):
#IDU2-XSWVersion=0x0102
# Beispiele (Rolle IDU1):
#IDU1-XSWVersion=0x0102
#IDU1*MVehName=ICN 500 012
