# === Pixy 1000 (Intel Atom Apollo Lake E3940) — geraetespezifische Hardware ===
# Ermittelt aus lspci/lsusb/proc-input des realen Geraets.

# --- Ethernet -----------------------------------------------------------
# 2x Intel Ethernet Controller I225-IT [8086:0d9f] an PCIe (01:00.0, 02:00.0).
# ACHTUNG: I225 wird vom Treiber "igc" bedient — das bisherige CONFIG_IGB
# (fuer den i210 des INC-100) passt hier NICHT und laesst beide Ports tot.
CONFIG_IGC=y

# --- Audio --------------------------------------------------------------
# Laut Architektur haengt Audio am USB-Signal-Converter der Extension-Karte
# "Serial & Audio". Auf dem Testgeraet war diese Karte nicht bestueckt:
# weder ein HDA-Controller in lspci noch ein USB-Audiogeraet in lsusb.
# Die Unterstuetzung wird hier vorbereitet, damit sie beim Bestuecken
# sofort greift.
CONFIG_SND=y
CONFIG_SND_PCM=y
CONFIG_SND_USB=y
CONFIG_SND_USB_AUDIO=y

# --- Bedienelemente (beide USB-HID) -------------------------------------
# Key Panel: "Pixy Software Keypanel USB Device" [c251:0000] meldet sich als
#   HID-Tastatur (Handlers: sysrq kbd leds event4) -> die bestehende
#   Tastenauswertung der GUI funktioniert unveraendert.
# Touchscreen: "DIALOGUE INC PenMount USB" [14e1:6000] (Handlers: event5
#   mouse0) -> CONFIG_HID_PENMOUNT steht bereits in touch-penmount.cfg.
CONFIG_USB_HID=y
CONFIG_HID_GENERIC=y

# --- Grafik -------------------------------------------------------------
# HD Graphics 500 [8086:5a85], Gen9. Anders als bei Bay Trail laeuft i915
# hier regulaer; der fbdev-Umweg des INC-100 ist voraussichtlich nicht noetig.
CONFIG_DRM_I915=y
