# === UEFI-Boot + GPT (Pixy 1000, Apollo Lake) ===
# Das Image nutzt eine GPT-Partitionstabelle; ohne EFI_PARTITION kann der
# Kernel sie nicht auswerten und findet das Root-Dateisystem nicht.
CONFIG_EFI_PARTITION=y

# EFI-Boot-Unterstuetzung und EFI-Stub
CONFIG_EFI=y
CONFIG_EFI_STUB=y

# EFI-Variablen als Dateisystem. Auf dem Referenzgeraet fehlte genau das
# (efibootmgr meldete "EFI variables are not supported"). Zum Booten ist es
# nicht noetig — der Fallback-Pfad EFI/BOOT/bootx64.efi braucht keine
# Variablen — aber so lassen sich Boot-Eintraege wenigstens einsehen.
CONFIG_EFIVAR_FS=y

# Framebuffer waehrend des Bootens (Kernelmeldungen vor dem Grafiktreiber)
CONFIG_FB_EFI=y
CONFIG_SYSFB_SIMPLEFB=y
