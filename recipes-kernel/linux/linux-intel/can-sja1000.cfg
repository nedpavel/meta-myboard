# === SocketCAN / NXP SJA1000 ===
# Built as MODULES on purpose: /etc/modules-load.d/can.conf loads
# can, can-dev, sja1000, sja1000_isa at boot, and sja1000_isa then picks up
# its I/O port + IRQ from /etc/modprobe.d/sja1000.conf (port=0x340 irq=5).
# A built-in (=y) sja1000_isa ignores modprobe.d and fails at boot with
# "sja1000_isa: insufficient parameters supplied" -> ISA CAN would not work.
CONFIG_CAN=m
CONFIG_CAN_RAW=m
CONFIG_CAN_BCM=m
CONFIG_CAN_GW=m
CONFIG_CAN_DEV=m
CONFIG_CAN_CALC_BITTIMING=y
CONFIG_CAN_SJA1000=m
CONFIG_CAN_SJA1000_ISA=m
CONFIG_CAN_SJA1000_PLATFORM=m
