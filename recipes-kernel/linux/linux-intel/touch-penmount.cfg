# === Penmount 6000 USB HID Touchscreen ===
CONFIG_INPUT=y
CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_HID=y
CONFIG_USB_HID=y
CONFIG_HID_GENERIC=y

# The PenMount 6000 (14e1:6000) enumerates as a HID device but has a broken
# report descriptor -- hid-generic binds it as a plain "mouse" and produces
# NO touch events. The dedicated hid-penmount driver claims the device (HID
# drivers with a matching id take priority over hid-generic) and works around
# the report-descriptor bug. This is the actual fix for touch input.
# (This kernel no longer has the old usbtouchscreen TOUCHSCREEN_USB_PENMOUNT.)
CONFIG_HID_PENMOUNT=y
