# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-myboard"
BBFILE_PATTERN_meta-myboard = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-myboard = "6"

# firefox-browser-layer = meta-browser/meta-firefox (Zweig wrynose):
# browser-kiosk zeigt die Webseiten mit Firefox
LAYERDEPENDS_meta-myboard = "core firefox-browser-layer"
LAYERSERIES_COMPAT_meta-myboard = "wrynose"
