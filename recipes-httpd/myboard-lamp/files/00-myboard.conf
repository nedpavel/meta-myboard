# Apache fuer das Pixy 1000 (myboard-lamp). Ersetzt den frueheren nginx.
#
#   - Web-Wurzel /var/www/localhost/html: dort haengt myboard-web seine
#     PHP-Seiten per tmpfiles-Link ein (index.php, daten.php, upload.php)
#   - PHP ueber php-fpm (127.0.0.1:9000) mit mod_proxy_fcgi - auch fuer
#     phpMyAdmin (/phpmyadmin, conf.d/phpmyadmin.conf)
#   - mod_proxy/mod_proxy_http fuer die Web-Oberflaeche (/api/,
#     conf.d/myboard-webgui.conf)
#
# Die Module sind gebaut, aber in httpd.conf nicht geladen.

<IfModule !proxy_module>
    LoadModule proxy_module /usr/libexec/apache2/modules/mod_proxy.so
</IfModule>
<IfModule !proxy_fcgi_module>
    LoadModule proxy_fcgi_module /usr/libexec/apache2/modules/mod_proxy_fcgi.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module /usr/libexec/apache2/modules/mod_proxy_http.so
</IfModule>

DocumentRoot "/var/www/localhost/html"
<Directory "/var/www/localhost/html">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
DirectoryIndex index.php index.html

# PHP-Dateien an php-fpm (laeuft als nobody, meldet sich bei MariaDB ueber
# unix_socket als 'nobody' an)
<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://127.0.0.1:9000"
</FilesMatch>
